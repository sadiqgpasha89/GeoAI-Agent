[project]
name = "geoai-agent"
version = "1.0.0"
description = "Agentic geospatial intelligence: LLM + VLM + deterministic geospatial tools for floods, wildfires, earthquakes, urban planning and crop health."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "langgraph>=0.2.60",
  "anthropic>=0.40",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "pillow>=10.4",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "sqlalchemy>=2.0",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7"]

[project.scripts]
geoai-generate-samples = "geoai.samples.generate:main"
geoai-export-static = "geoai.export_static:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 180
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "E741", "SIM102", "SIM103", "SIM105", "SIM108", "B007", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402"]
